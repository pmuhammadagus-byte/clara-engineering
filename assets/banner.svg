<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Clara Engineering banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#1a1438"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- blueprint grid -->
  <g opacity="0.10" stroke="#7c5cff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M300 0 V400 M600 0 V400 M900 0 V400"/>
  </g>

  <!-- center emblem: gear + debug magnifier over code braces -->
  <g transform="translate(600,150)">
    <circle r="80" fill="#0e1330" stroke="url(#accent)" stroke-width="4"/>
    <!-- gear teeth -->
    <g fill="#7c5cff" opacity="0.9">
      <rect x="-6" y="-88" width="12" height="18" rx="3"/>
      <rect x="-6" y="70" width="12" height="18" rx="3"/>
      <rect x="-88" y="-6" width="18" height="12" rx="3"/>
      <rect x="70" y="-6" width="18" height="12" rx="3"/>
    </g>
    <text x="0" y="14" text-anchor="middle" font-family="Consolas, monospace" font-size="46" font-weight="700" fill="#22d3ee">{ }</text>
    <!-- magnifier -->
    <circle cx="34" cy="-30" r="22" fill="none" stroke="#22d3ee" stroke-width="5"/>
    <line x1="50" y1="-14" x2="70" y2="6" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="600" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#f2f6ff">Clara Engineering</text>
  <text x="600" y="323" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#b3a8e0">Elite coding &amp; debug engine for OpenClaw</text>
  <rect x="470" y="350" width="260" height="6" rx="3" fill="url(#accent)"/>
</svg>
